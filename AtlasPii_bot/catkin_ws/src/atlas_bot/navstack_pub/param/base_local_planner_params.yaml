DWAPlannerROS:

  # Robot limits
  max_vel_x: 0.172
  min_vel_x: 0.1

  max_vel_theta: 0.8
  min_vel_theta: 0.2

  acc_lim_x: 0.5
  acc_lim_theta: 1.0

  # Goal tolerance
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.25
  latch_xy_goal_tolerance: true

  # Simulation
  sim_time: 2.0
  sim_granularity: 0.025

  vx_samples: 15
  vtheta_samples: 20

  # Cost function
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02

  forward_point_distance: 0.325
  stop_time_buffer: 0.2

  oscillation_reset_dist: 0.05

  prune_plan: true

